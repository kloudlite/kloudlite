name: "Build Nightly"

run-name: "Nightly — ${{ github.sha }}"

on:
  schedule:
    # ~midnight IST (18:30 UTC)
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/kloudlite/kloudlite
  DAGGER_VERSION: "0.21.0"
  DAGGER_ENGINE_IMAGE: ghcr.io/kloudlite/kloudlite/dagger-engine:v0.21.0

jobs:
  prepare:
    name: Prepare nightly tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Compute tag
        id: tag
        run: |
          DATE=$(date -u +%Y%m%d)
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          TAG="nightly-${DATE}-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-nightly.${DATE}" >> "$GITHUB_OUTPUT"

  # -- Publish all Docker images via Dagger ---------------------------
  publish-all:
    name: Publish all images
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Install Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          dagger-flags: --progress plain --engine-image ${{ env.DAGGER_ENGINE_IMAGE }}

      - name: Publish all images
        working-directory: build-sys
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          dagger call publish-all-images \
            --source .. \
            --tag "$TAG" \
            --registry "${{ env.REGISTRY }}" \
            --registry-username "${{ github.actor }}" \
            --registry-token env:GITHUB_TOKEN

      - name: Build summary
        run: |
          echo "### Nightly Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ needs.prepare.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ needs.prepare.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # -- kltun binary (for nightly release) -----------------------------
  kltun:
    name: Build kltun
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Install Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          dagger-flags: --progress plain --engine-image ${{ env.DAGGER_ENGINE_IMAGE }}

      - name: Build kltun binary
        working-directory: build-sys
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          dagger call build-app \
            --source .. \
            --app kltun \
            --version "$TAG"

  # -- desktop build (unchanged, native runners) ----------------------
  desktop:
    name: Desktop
    needs: prepare
    uses: ./.github/workflows/_build-desktop.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      ref: development
    secrets: inherit

  # -- Nightly releases -----------------------------------------------
  release-desktop:
    name: Release desktop nightly
    needs: [prepare, desktop]
    uses: ./.github/workflows/_release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      is_nightly: true
      ref: development

  # -- Deploy to development ------------------------------------------
  deploy:
    name: Deploy to development
    needs:
      - prepare
      - publish-all
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy in kloudlite-ci
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          if [ -z "$DEPLOY_PAT" ]; then
            echo "::error::Missing required secret: DEPLOY_PAT"
            exit 1
          fi

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOY_PAT}" \
            https://api.github.com/repos/kloudlite/kloudlite-ci/dispatches \
            -d @- <<EOF
          {
            "event_type": "deploy",
            "client_payload": {
              "version": "${{ needs.prepare.outputs.tag }}",
              "environment": "development",
              "is_nightly": true
            }
          }
          EOF
