name: "Checks & Tests"

run-name: "Checks — ${{ github.ref_name }} (${{ github.sha }})"

on:
  push:
    branches-ignore:
      - master
      - uat
      - development

permissions:
  contents: read

env:
  DAGGER_VERSION: "0.21.0"
  DAGGER_ENGINE_IMAGE: ghcr.io/kloudlite/kloudlite/dagger-engine:v0.21.0

jobs:
  # -- Go: format + build + test (batched, shared caches) -------------
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          dagger-flags: --progress plain --engine-image ${{ env.DAGGER_ENGINE_IMAGE }}

      - name: Run Go checks (fmt -> build -> test)
        working-directory: build-sys
        run: |
          dagger call run-go-checks --source .. container

  # -- Web: build per app (batched, shared node_modules) --------------
  web:
    name: Web checks (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [console, dashboard, website]
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          dagger-flags: --progress plain --engine-image ${{ env.DAGGER_ENGINE_IMAGE }}

      - name: Run web checks (build)
        working-directory: build-sys
        run: |
          dagger call run-web-checks --source .. --app ${{ matrix.app }} container
