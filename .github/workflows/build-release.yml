name: "Build Release"

# Per-app tags: <app>/v<semver>
# Manual dispatch: select apps + version (for UAT)
run-name: "${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Build {0}', inputs.version) }}"

on:
  push:
    tags:
      - '*/v*'

  workflow_dispatch:
    inputs:
      api-server:
        description: 'API Server image'
        type: boolean
        default: false
      workmachine-manager:
        description: 'WorkMachine Manager image'
        type: boolean
        default: false
      tunnel-server:
        description: 'Tunnel Server image'
        type: boolean
        default: false
      oci-installer:
        description: 'OCI Installer'
        type: boolean
        default: false
      code-analyzer:
        description: 'Code Analyzer'
        type: boolean
        default: false
      k3s-backup:
        description: 'K3s Backup'
        type: boolean
        default: false
      workspace-base:
        description: 'Workspace Base'
        type: boolean
        default: false
      workspace-comprehensive:
        description: 'Workspace Comprehensive'
        type: boolean
        default: false
      console:
        description: 'Console'
        type: boolean
        default: false
      dashboard:
        description: 'Dashboard'
        type: boolean
        default: false
      website:
        description: 'Website'
        type: boolean
        default: false
      kltun:
        description: 'kltun CLI'
        type: boolean
        default: false
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/kloudlite/kloudlite
  DAGGER_VERSION: "0.21.0"

jobs:
  # -- Prepare: parse tag or manual inputs -----------------------------
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      app_name: ${{ steps.resolve.outputs.app_name }}
      is_tag_push: ${{ steps.resolve.outputs.is_tag_push }}
      apps_json: ${{ steps.apps.outputs.apps_json }}
      has_apps: ${{ steps.apps.outputs.has_apps }}
      has_kltun: ${{ steps.apps.outputs.has_kltun }}
    steps:
      - name: Resolve version and tag
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            FULL_TAG="${GITHUB_REF_NAME}"
            APP_NAME="${FULL_TAG%%/v*}"
            VERSION_TAG="${FULL_TAG#*/}"
            VERSION="${VERSION_TAG#v}"
            echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag_push=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${APP_NAME} at ${VERSION_TAG}"
          else
            TAG="${{ inputs.version }}"
            VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "app_name=" >> "$GITHUB_OUTPUT"
            echo "is_tag_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine apps to build
        id: apps
        run: |
          IS_TAG_PUSH="${{ steps.resolve.outputs.is_tag_push }}"
          APP_NAME="${{ steps.resolve.outputs.app_name }}"

          ALL_DOCKER_APPS="api-server workmachine-manager tunnel-server oci-installer code-analyzer k3s-backup workspace-base workspace-comprehensive console dashboard website"

          SELECTED=()

          if [ "$IS_TAG_PUSH" = "true" ]; then
            case "$APP_NAME" in
              kltun)
                echo "has_kltun=true" >> "$GITHUB_OUTPUT"
                echo "apps_json=[]" >> "$GITHUB_OUTPUT"
                ;;
              *)
                for APP in $ALL_DOCKER_APPS; do
                  if [ "$APP" = "$APP_NAME" ]; then
                    SELECTED+=("$APP")
                    break
                  fi
                done
                echo "has_kltun=false" >> "$GITHUB_OUTPUT"
                echo "apps_json=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -s .)" >> "$GITHUB_OUTPUT"
                ;;
            esac
            echo "has_apps=true" >> "$GITHUB_OUTPUT"

          else
            for APP in $ALL_DOCKER_APPS; do
              VAL="false"
              case "$APP" in
                api-server)             VAL="${{ inputs.api-server }}" ;;
                workmachine-manager)    VAL="${{ inputs.workmachine-manager }}" ;;
                tunnel-server)          VAL="${{ inputs.tunnel-server }}" ;;
                oci-installer)          VAL="${{ inputs.oci-installer }}" ;;
                code-analyzer)          VAL="${{ inputs.code-analyzer }}" ;;
                k3s-backup)             VAL="${{ inputs.k3s-backup }}" ;;
                workspace-base)         VAL="${{ inputs.workspace-base }}" ;;
                workspace-comprehensive) VAL="${{ inputs.workspace-comprehensive }}" ;;
                console)                VAL="${{ inputs.console }}" ;;
                dashboard)              VAL="${{ inputs.dashboard }}" ;;
                website)                VAL="${{ inputs.website }}" ;;
              esac
              if [ "$VAL" = "true" ]; then
                SELECTED+=("$APP")
              fi
            done

            echo "has_kltun=${{ inputs.kltun }}" >> "$GITHUB_OUTPUT"
            echo "apps_json=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -s .)" >> "$GITHUB_OUTPUT"
            HAS_APPS="false"
            [ "${#SELECTED[@]}" -gt 0 ] && HAS_APPS="true"
            [ "${{ inputs.kltun }}" = "true" ] && HAS_APPS="true"
            echo "has_apps=${HAS_APPS}" >> "$GITHUB_OUTPUT"

            if [ "$HAS_APPS" = "false" ]; then
              echo "::error::No apps selected"
            fi
          fi

      - name: Summary
        run: |
          echo "### Release Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.resolve.outputs.is_tag_push }}" = "true" ]; then
            echo "**App:** \`${{ steps.resolve.outputs.app_name }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "**Tag:** \`${{ steps.resolve.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Manual dispatch** -- version \`${{ steps.resolve.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # -- Docker images (built via Dagger) ---------------------------------
  dagger-build:
    name: Publish ${{ matrix.app }}
    needs: prepare
    if: needs.prepare.outputs.has_apps == 'true' && fromJSON(needs.prepare.outputs.apps_json)[0] != null
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps_json) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Build and publish ${{ matrix.app }}
        working-directory: build-sys
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          dagger call publish-image \
            --source .. \
            --app ${{ matrix.app }} \
            --tag "$TAG" \
            --registry "${{ env.REGISTRY }}" \
            --registry-username "${{ github.actor }}" \
            --registry-token env:GITHUB_TOKEN

  # -- kltun binary + GitHub Release ------------------------------------
  kltun:
    name: Release kltun
    needs: prepare
    if: needs.prepare.outputs.has_apps == 'true' && needs.prepare.outputs.has_kltun == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Release kltun binaries
        working-directory: build-sys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger call release-binaries \
            --source .. \
            --version "${{ needs.prepare.outputs.version }}" \
            --git-hub-token env:GITHUB_TOKEN \
            --repository kloudlite/kloudlite \
            --app kltun
