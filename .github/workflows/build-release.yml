name: "Build Release"

# Per-app tags: <app>/v<semver>
# Manual dispatch: select apps grouped by plane + version
run-name: "${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Build {0}', inputs.version) }}"

on:
  push:
    tags:
      - '*/v*'

  workflow_dispatch:
    inputs:
      # -- kloudlite-plane ------------------------------------------------
      console:
        description: 'console — Web app (kloudlite-plane)'
        type: boolean
        default: false
      website:
        description: 'website — Web app (kloudlite-plane)'
        type: boolean
        default: false
      oci-installer:
        description: 'oci-installer — Go binary image (kloudlite-plane)'
        type: boolean
        default: false

      # -- platform-plane -------------------------------------------------
      dashboard:
        description: 'dashboard — Web app (platform-plane)'
        type: boolean
        default: false
      api-server:
        description: 'api-server — Go binary image (platform-plane)'
        type: boolean
        default: false

      # -- user -----------------------------------------------------------
      kltun-golang:
        description: 'kltun — Go CLI binary (user)'
        type: boolean
        default: false

      # -- workmachine-plane ----------------------------------------------
      workmachine-manager:
        description: 'workmachine-manager — Go binary image (workmachine-plane)'
        type: boolean
        default: false
      workspace:
        description: 'workspace — base + comprehensive images (workmachine-plane)'
        type: boolean
        default: false
      tunnel-server:
        description: 'tunnel-server — WireGuard tunnel image (workmachine-plane)'
        type: boolean
        default: false
      code-analyzer:
        description: 'code-analyzer — Semgrep image (workmachine-plane)'
        type: boolean
        default: false
      k3s-backup:
        description: 'k3s-backup — AWS CLI backup image (workmachine-plane)'
        type: boolean
        default: false

      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/kloudlite/kloudlite
  DAGGER_VERSION: "0.21.0"

jobs:
  # -- Prepare: parse tag or manual inputs -----------------------------
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      apps_json: ${{ steps.apps.outputs.apps_json }}
      has_apps: ${{ steps.apps.outputs.has_apps }}
      has_kltun: ${{ steps.apps.outputs.has_kltun }}
    steps:
      - name: Resolve version and tag
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            FULL_TAG="${GITHUB_REF_NAME}"
            APP_NAME="${FULL_TAG%%/v*}"
            VERSION_TAG="${FULL_TAG#*/}"
            VERSION="${VERSION_TAG#v}"
            echo "tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
            echo "Releasing ${APP_NAME} at ${VERSION_TAG}"
          else
            TAG="${{ inputs.version }}"
            VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine apps to build
        id: apps
        run: |
          IS_TAG_PUSH="${{ github.ref_type == 'tag' && 'true' || 'false' }}"
          APP_NAME="${{ steps.resolve.outputs.app_name }}"

          # Docker image apps that dagger publish-image supports
          ALL_DOCKER="api-server workmachine-manager tunnel-server oci-installer code-analyzer k3s-backup workspace-base workspace-comprehensive console dashboard website"

          if [ "$IS_TAG_PUSH" = "true" ]; then
            SELECTED=()
            HAS_KLtun="false"
            case "$APP_NAME" in
              kltun)        HAS_KLTUN="true" ;;
              workspace)    SELECTED=("workspace-base" "workspace-comprehensive") ;;
              *)
                for APP in $ALL_DOCKER; do
                  [ "$APP" = "$APP_NAME" ] && SELECTED+=("$APP") && break
                done
                ;;
            esac
            echo "has_kltun=${HAS_KLTUN:-false}" >> "$GITHUB_OUTPUT"
            echo "apps_json=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -s .)" >> "$GITHUB_OUTPUT"
            echo "has_apps=true" >> "$GITHUB_OUTPUT"

          else
            # Manual dispatch — map user-facing names to dagger app names
            SELECTED=()
            HAS_KLtun="false"

            [ "${{ inputs.console }}" = "true" ] && SELECTED+=("console")
            [ "${{ inputs.website }}" = "true" ] && SELECTED+=("website")
            [ "${{ inputs.oci-installer }}" = "true" ] && SELECTED+=("oci-installer")
            [ "${{ inputs.dashboard }}" = "true" ] && SELECTED+=("dashboard")
            [ "${{ inputs.api-server }}" = "true" ] && SELECTED+=("api-server")
            [ "${{ inputs.workmachine-manager }}" = "true" ] && SELECTED+=("workmachine-manager")
            [ "${{ inputs.tunnel-server }}" = "true" ] && SELECTED+=("tunnel-server")
            [ "${{ inputs.code-analyzer }}" = "true" ] && SELECTED+=("code-analyzer")
            [ "${{ inputs.k3s-backup }}" = "true" ] && SELECTED+=("k3s-backup")
            if [ "${{ inputs.workspace }}" = "true" ]; then
              SELECTED+=("workspace-base" "workspace-comprehensive")
            fi
            if [ "${{ inputs.kltun-golang }}" = "true" ]; then
              HAS_KLTUN="true"
            fi

            echo "has_kltun=${HAS_KLTUN:-false}" >> "$GITHUB_OUTPUT"
            echo "apps_json=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -s .)" >> "$GITHUB_OUTPUT"
            HAS_APPS="false"
            [ "${#SELECTED[@]}" -gt 0 ] && HAS_APPS="true"
            [ "${HAS_KLTUN:-false}" = "true" ] && HAS_APPS="true"
            echo "has_apps=${HAS_APPS}" >> "$GITHUB_OUTPUT"

            if [ "$HAS_APPS" = "false" ]; then
              echo "::error::No apps selected"
            fi
          fi

      - name: Summary
        run: |
          echo "### Release Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "**App:** \`${{ steps.resolve.outputs.app_name }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "**Tag:** \`${{ steps.resolve.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Manual dispatch** — version \`${{ steps.resolve.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "**Selected:** \`${{ steps.apps.outputs.apps_json }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # -- Docker images (built via Dagger) ---------------------------------
  docker:
    name: Publish ${{ matrix.app }}
    needs: prepare
    if: needs.prepare.outputs.has_apps == 'true' && fromJSON(needs.prepare.outputs.apps_json)[0] != null
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps_json) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Build and publish ${{ matrix.app }}
        working-directory: build-sys
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          dagger call publish-image \
            --source .. \
            --app ${{ matrix.app }} \
            --tag "$TAG" \
            --registry "${{ env.REGISTRY }}" \
            --registry-username "${{ github.actor }}" \
            --registry-token env:GITHUB_TOKEN

  # -- kltun binary + GitHub Release ------------------------------------
  kltun:
    name: Release kltun
    needs: prepare
    if: needs.prepare.outputs.has_apps == 'true' && needs.prepare.outputs.has_kltun == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        uses: dagger/dagger-for-github@v7
        with:
          version: ${{ env.DAGGER_VERSION }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Release kltun binaries
        working-directory: build-sys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dagger call release-binaries \
            --source .. \
            --version "${{ needs.prepare.outputs.version }}" \
            --git-hub-token env:GITHUB_TOKEN \
            --repository kloudlite/kloudlite \
            --app kltun
