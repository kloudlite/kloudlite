version: 3

includes:
  api:
    taskfile: ./api/Taskfile.yml
    dir: .

tasks:
  backend:build:platform-api:
    desc: Build the unified kloudlite binary used by platform-api
    cmds:
      - task: api:build:platform-api

  backend:verify:roadmap:
    desc: Run focused backend roadmap verification tests
    cmds:
      - task: api:verify:backend-roadmap

  backend:verify:platform-api:
    desc: Build platform-api and run focused platform-api tests
    cmds:
      - task: api:verify:platform-api
