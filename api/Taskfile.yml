version: 3

tasks:
  build:platform-api:
    desc: Build the api-server binary
    cmds:
      - task: build:api-server

  build:api-server:
    desc: Build the api-server binary
    env:
      CGO_ENABLED: 0
    cmds:
      - go build -ldflags='-s -w' -o bin/api-server ./cli/kloudlite/

  build:workmachine-manager:
    desc: Build the workmachine-manager binary
    env:
      CGO_ENABLED: 0
    cmds:
      - go build -ldflags='-s -w' -o bin/workmachine-manager ./cli/kloudlite/

  build:kloudlite:
    desc: Compatibility alias for build:api-server
    cmds:
      - task: build:api-server

  build:server:
    desc: Compatibility alias for build:api-server
    cmds:
      - task: build:api-server

  build:tunnel-server:
    desc: Compatibility alias for build:api-server
    cmds:
      - task: build:api-server

  build:oci-installer:
    env:
      CGO_ENABLED: 0
    cmds:
      - go build -ldflags='-s -w' -o bin/oci-installer ./cli/kli/oci-installer/

  manifests:
    desc: Generate CRDs, embedded CRD assets, and deepcopy files
    cmds:
      # generate CRDs from type definitions
      - controller-gen crd paths="./types/..." output:crd:artifacts:config=manifests
      - go run api/crds/assets/generate.go -manifests manifests -output api/crds/assets/generated.go
      - task: consolidate-crds

      # generate deep copy go files
      - controller-gen object paths="./..."
      # - controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:stdout

  consolidate-crds:
    desc: Consolidate all CRD manifests into single file for kli
    cmds:
      - cat manifests/*.yaml > cli/kli/internal/manifests/crds.yaml
      - echo "Consolidated CRDs into cli/kli/internal/manifests/crds.yaml"

  verify:backend-roadmap:
    desc: Run focused backend roadmap verification tests
    cmds:
      - go test ./api/crds/... ./api/config ./api/k8s ./api/server ./api/resources/... ./pkg/intercepts ./controllers/composition ./controllers/environment ./controllers/workmachine ./controllers/workspace ./cli/kl/cmd ./cli/kl/pkg/workspace ./cli/kloudlite/cmd -v

  verify:platform-api:
    desc: Build the platform-api binary and run focused platform-api tests
    cmds:
      - task: build:platform-api
      - go test ./api/crds/... ./api/config ./api/k8s ./api/server ./api/resources/... ./cli/kloudlite/cmd -v
