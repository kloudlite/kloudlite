[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:init-kl-home]
command=/bin/bash -c "\
  chown kl:kl /home/kl && \
  mkdir -p /home/kl/.ssh /home/kl/.config/code-server /home/kl/.local && \
  chmod 700 /home/kl/.ssh && \
  chown -R kl:kl /home/kl/.ssh /home/kl/.config /home/kl/.local && \
  printf 'bind-addr: 0.0.0.0:8080\nauth: none\ncert: false\n' > /home/kl/.config/code-server/config.yaml && \
  chown kl:kl /home/kl/.config/code-server/config.yaml && \
  /etc/kloudlite/init-shell-configs.sh && \
  echo 'Init complete'"
priority=1
startsecs=0
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
priority=10
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:code-server]
priority=10
command=/usr/bin/code-server --auth none --bind-addr 0.0.0.0:8080
user=kl
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/kl"

[program:ghostty-web]
priority=20
command=/home/kl/.local/bin/ghostty-web-demo
user=kl
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/kl",PORT="7681",SHELL="/usr/bin/fish"

[program:install-claude-code]
command=/bin/bash -c "\
  if [ ! -d /home/kl/.local/lib/node_modules/@anthropic-ai/claude-code ] || [ ! -L /home/kl/.local/bin/claude ]; then \
    echo 'Installing Claude Code in user scope...'; \
    su -s /bin/bash kl -c 'npm install -g @anthropic-ai/claude-code --prefix /home/kl/.local'; \
    echo 'Claude Code installed successfully'; \
  else \
    echo 'Claude Code already installed, skipping'; \
  fi"
priority=15
startsecs=0
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:claude-code-ghostty]
priority=20
command=/home/kl/.local/bin/ghostty-web-demo
user=kl
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/kl",PORT="7682",SHELL="/home/kl/.local/bin/claude"

